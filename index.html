    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1a; color: #f1f5f9; font-family: sans-serif; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        @keyframes slideInBar { from { width: 0; } to { width: var(--target-width); } }
        .stat-bar-animated { animation: slideInBar 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        
        @keyframes countUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .counter-animated { animation: countUp 0.5s ease-out forwards; }
        
        .progress-ring__circle { transition: stroke-dashoffset 1s ease-in-out; }
        
        .btn-accion {
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            padding: 4px 12px; border-radius: 8px; font-size: 10px; font-weight: 700;
            transition: all 0.2s; border: 1px solid transparent; cursor: pointer;
            min-height: 28px; text-transform: uppercase; letter-spacing: 0.3px;
        }
        .btn-accion:hover { transform: translateY(-1px) scale(1.04); }
        .btn-primary { background: #ef4444; color: white; }
        .btn-secondary { background: #111827; color: #f1f5f9; border-color: #1e293b; }
        .btn-success { background: #10b981; color: white; }
        
        .card {
            background: linear-gradient(145deg, #111827, #0f1729);
            border: 1px solid #1e293b; border-radius: 16px; padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        .input-field {
            width: 100%; background: #0a0f1a; border: 1px solid #1e293b;
            border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #f1f5f9;
            transition: all 0.3s; outline: none;
        }
        .input-field:focus { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15); }
        
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 20px; font-size: 9px; font-weight: 700; text-transform: uppercase; }
        .badge-info { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }
        .badge-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-warning { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        
        @media (max-width: 640px) {
            .card { padding: 14px; border-radius: 12px; }

        .install-banner {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155; border-radius: 14px; padding: 14px 20px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
        }

</head>
<body class="bg-[#0a0f1a] text-slate-100 min-h-screen font-sans antialiased">
    <div id="root"></div>

    <div id="install-banner" class="install-banner fixed bottom-4 left-4 right-4 md:left-auto md:right-4 md:max-w-sm z-[9998]" style="display:none;">

            </div>
            <p class="text-xs text-slate-600 mt-4">Error: <span id="error-detalle" class="text-red-400"></span></p>

    <script type="text/babel">
        const CONFIG = {
            apiKey: "AIzaSyB8H_zzIWZ0TAoYJM1FbJ_a-uv7Kzzb4E8",
            authDomain: "reportesbomberospedraza.firebaseapp.com",
            projectId: "reportesbomberospedraza",
            storageBucket: "reportesbomberospedraza.firebasestorage.app",
            messagingSenderId: "872707089111",
            appId: "1:872707089111:web:67b1dd2f39c14be6130692",
        };

        let app, auth, db, firebaseReady = false;
        try {
            app = firebase.initializeApp(CONFIG);
            auth = firebase.auth();
            db = firebase.firestore();
            firebaseReady = true;
        } catch (e) {
            console.error("Error Firebase:", e);
        }

        // ===== OBJETO AUTH =====
        const AUTH = {
            iniciarSesion: async function(email, password) {
                if (!firebaseReady) return { success: false, error: 'Firebase no disponible' };
                try {
                    const credencial = await auth.signInWithEmailAndPassword(email, password);
                    localStorage.setItem('SESION_BOMBEROS', JSON.stringify({ uid: credencial.user.uid, email: credencial.user.email, timestamp: Date.now() }));
                    return { success: true, user: credencial.user };
                } catch (error) {
                    let mensaje = 'Error de autenticación';
                    if (error.code === 'auth/invalid-email') mensaje = 'Email inválido';
                    if (error.code === 'auth/user-not-found') mensaje = 'Usuario no registrado';
                    if (error.code === 'auth/wrong-password') mensaje = 'Contraseña incorrecta';
                    if (error.code === 'auth/network-request-failed') mensaje = 'Error de conexión a internet';
                    return { success: false, error: mensaje };
                }
            },
            cerrarSesion: function() { if (auth) auth.signOut(); localStorage.removeItem('SESION_BOMBEROS'); },
            verificarSesion: function() {
                const sesion = localStorage.getItem('SESION_BOMBEROS');
                if (sesion) {
                    try {
                        const data = JSON.parse(sesion);
                        if (Date.now() - data.timestamp < 86400000) return data;
                    } catch (e) { return null; }
                }
                return null;
            }
        };

        const LISTA_SERVICIOS = ["Traslados", "Toma de Tensión Arterial", "Suministro de Medicamentos", "Nebulización", "Abastecimiento de Agua", "Guardia de Seguridad y Prevención", "Frente Preventivo", "Preparación Ciudadana", "Apoyo Institucional", "Colisión entre Vehículos", "Colisión Vehículo-Moto", "Colisión entre Motos", "Derrape de Moto", "Volcamiento", "Atropello", "Lesionado en Accidente de Tránsito", "Fallecido en Accidente de Tránsito", "Inspección de Avispas", "Inspección de Abejas", "Reubicación de Avispas", "Reubicación de Abejas", "Incendio Estructural", "Incendio Forestal", "Incendio de Vehículo", "Incendio de Basura", "Mordedura de Serpiente", "Otro Servicio no Señalado"];
        const ORGANISMOS = ["Policía Nacional Bolivariana", "Policía Estado Barinas", "Guardia Nacional Bolivariana", "CICPC - Socopó", "Protección Civil", "Alcaldía Municipio Pedraza", "Bomberos Barinas", "Bomberos Socopo"];
        const UNIDADES = ["Unidad 03 VIR", "Unidad 05 Ambulancia", "Unidad 05 Moto", "Unidad 06 Táctica y Apoyo", "Unidad 07 Cisterna", "Unidad 04 Moto", "Vehículo Particular"];
        const PARROQUIAS = ["PARROQUIA CIUDAD BOLIVIA", "PARROQUIA JOSÉ FÉLIX RIBAS", "PARROQUIA IGNACIO BRICEÑO", "PARROQUIA JOSÉ ANTONIO PÁEZ"];
        
        const ADMIN_EMAILS = ['bomberospedraza@gmail.com'];

        // ===== PROTECCIÓN CONTRA ERRORES =====
        function obtenerNombreSeccion(email) { 
            if (!email) return 'Funcionario';
            return email.split('@')[0] || 'Usuario'; 
        }

        function esAdmin(email) { return ADMIN_EMAILS.includes(email); }

        function PantallaLogin({ onLogin }) {
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    const cred = await auth.signInWithEmailAndPassword(email, password);
                    onLogin(cred.user);
                } catch (err) {
                    setError('Email o contraseña incorrectos');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-[#0a0f1a] p-4">
                    <div className="card max-w-md w-full p-8 fade-in">
                        <div className="text-center mb-8">
                            <div className="flex items-center justify-center gap-3 mb-4">
                                <img src="images/dgnb.png" style={{ width: '50px', height: '50px', objectFit: 'contain' }} alt="DGNB" />
                                <img src="images/logo.png" style={{ width: '50px', height: '50px', objectFit: 'contain' }} alt="Logo" />
                            </div>
                            <h1 className="text-3xl font-black text-white mt-2">Bomberos <span className="text-red-500">Pedraza</span></h1>
                            <p className="text-xs text-slate-400 font-bold uppercase tracking-wider mt-1">Acceso Exclusivo de Administradores</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1.5">Email</label>
                                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="input-field" placeholder="admin@gmail.com" required />
                            </div>
                            <div>
                                <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1.5">Contraseña</label>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="input-field" placeholder="••••••••" required />
                            </div>
                            {error && <div className="p-3 rounded-xl text-sm bg-red-950/30 border border-red-500/50 text-red-400">{error}</div>}
                            <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl">🔐 INGRESAR</button>
                        </form>
                    </div>
                </div>
            );
        }

        // ===== CLASE ERROR BOUNDARY (NO OLVIDAR ESTO) =====
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }
            static getDerivedStateFromError() {
                return { hasError: true };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-[#0a0f1a] p-4">
                            <div className="card max-w-md w-full text-center">
                                <h2 className="text-xl font-bold text-white mb-4">Ocurrió un error</h2>
                                <button onClick={() => window.location.reload()} className="btn-primary px-6 py-2 rounded-xl text-sm">🔄 Recargar</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function ProgressRing({ percentage, color, label }) {
            const radius = 45;
            const stroke = 8;
            const normalizedRadius = radius - stroke * 2;
            const circumference = normalizedRadius * 2 * Math.PI;
            const strokeDashoffset = circumference - (percentage / 100) * circumference;

            return (
                <div className="flex flex-col items-center justify-center">
                    <svg height={radius * 2} width={radius * 2} className="transform -rotate-90">
                        <circle stroke="#1e293b" strokeWidth={stroke} fill="transparent" r={normalizedRadius} cx={radius} cy={radius} />
                        <circle
                            stroke={color}
                            strokeWidth={stroke}
                            fill="transparent"
                            r={normalizedRadius}
                            cx={radius}
                            cy={radius}
                            strokeDasharray={`${circumference} ${circumference}`}
                            strokeDashoffset={strokeDashoffset}
                            strokeLinecap="round"
                            className="progress-ring__circle"
                        />
                    </svg>
                    <span className="text-2xl font-black mt-[-60px] text-white">{percentage}%</span>
                    <span className="text-[9px] uppercase font-bold text-slate-400 mt-2">{label}</span>
                </div>
            );
        }

        function Dashboard({ minutas }) {
            const stats = React.useMemo(() => {
                const totals = { total: minutas.length, servicios: {}, parroquias: {} };
                let culminados = 0, enCurso = 0, cancelados = 0;

                minutas.forEach(m => {
                    const s = m.servicioPersonalizado || m.servicioRealizado || 'Sin especificar';
                    totals.servicios[s] = (totals.servicios[s] || 0) + 1;
                    totals.parroquias[m.ubicacion] = (totals.parroquias[m.ubicacion] || 0) + 1;
                    
                    if (m.estatus === 'Culminado') culminados++;
                    else if (m.estatus === 'En Curso') enCurso++;
                    else if (m.estatus && m.estatus.includes('Cancelado')) cancelados++;
                });

                return { ...totals, culminados, enCurso, cancelados };
            }, [minutas]);

            const total = stats.total;
            const pctCulminados = total > 0 ? Math.round((stats.culminados / total) * 100) : 0;
            const pctEnCurso = total > 0 ? Math.round((stats.enCurso / total) * 100) : 0;
            const pctCancelados = total > 0 ? Math.round((stats.cancelados / total) * 100) : 0;

            const datosServicios = Object.entries(stats.servicios)
                .map(([nombre, valor]) => ({ nombre, valor }))
                .sort((a, b) => b.valor - a.valor)
                .slice(0, 5);

            const maxServicio = datosServicios.length > 0 ? datosServicios[0].valor : 1;
            const colores = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#a855f7'];
            const coloresTexto = ['text-red-400', 'text-amber-400', 'text-emerald-400', 'text-blue-400', 'text-purple-400'];

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-black text-white">📊 Panel de Control</h2>
                        <span className="text-xs text-slate-400 bg-slate-800 px-3 py-1 rounded-full">Actualizado en tiempo real</span>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="card p-4 flex flex-col items-center justify-center text-center border-l-4 border-l-red-500">
                            <p className="text-[9px] uppercase font-bold text-slate-400">Total Servicios</p>
                            <p className="text-4xl font-black text-red-500 counter-animated">{stats.total}</p>
                            <p className="text-[8px] text-slate-600 mt-1">Registrados</p>
                        </div>
                        <div className="card p-4 flex flex-col items-center justify-center text-center border-l-4 border-l-emerald-500">
                            <p className="text-[9px] uppercase font-bold text-slate-400">Culminados</p>
                            <p className="text-4xl font-black text-emerald-400 counter-animated">{stats.culminados}</p>
                            <p className="text-[8px] text-slate-600 mt-1">Completados</p>
                        </div>
                        <div className="card p-4 flex flex-col items-center justify-center text-center border-l-4 border-l-amber-500">
                            <p className="text-[9px] uppercase font-bold text-slate-400">En Curso</p>
                            <p className="text-4xl font-black text-amber-400 counter-animated">{stats.enCurso}</p>
                            <p className="text-[8px] text-slate-600 mt-1">Activos</p>
                        </div>
                        <div className="card p-4 flex flex-col items-center justify-center text-center border-l-4 border-l-purple-500">
                            <p className="text-[9px] uppercase font-bold text-slate-400">Cancelados</p>
                            <p className="text-4xl font-black text-purple-400 counter-animated">{stats.cancelados}</p>
                            <p className="text-[8px] text-slate-600 mt-1">Anulados</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="card p-4 flex items-center justify-around">
                            <ProgressRing percentage={pctCulminados} color="#10b981" label="Culminados" />
                            <div className="text-xs text-slate-400">
                                <p><span className="font-bold text-emerald-400">{stats.culminados}</span> culminados</p>
                                <p className="mt-1"><span className="font-bold text-slate-300">{pctCulminados}%</span> del total</p>
                            </div>
                        </div>
                        <div className="card p-4 flex items-center justify-around">
                            <ProgressRing percentage={pctEnCurso} color="#f59e0b" label="En Curso" />
                            <div className="text-xs text-slate-400">
                                <p><span className="font-bold text-amber-400">{stats.enCurso}</span> en curso</p>
                                <p className="mt-1"><span className="font-bold text-slate-300">{pctEnCurso}%</span> del total</p>
                            </div>
                        </div>
                        <div className="card p-4 flex items-center justify-around">
                            <ProgressRing percentage={pctCancelados} color="#a855f7" label="Cancelados" />
                            <div className="text-xs text-slate-400">
                                <p><span className="font-bold text-purple-400">{stats.cancelados}</span> cancelados</p>
                                <p className="mt-1"><span className="font-bold text-slate-300">{pctCancelados}%</span> del total</p>
                            </div>
                        </div>
                    </div>

                    <div className="card p-4">
                        <h4 className="text-sm font-bold text-white mb-4">🚨 Top 5 Servicios Realizados</h4>
                        {datosServicios.length === 0 ? (
                            <p className="text-center text-slate-500 py-4">Sin datos registrados aún</p>
                        ) : (
                            <div className="space-y-3">
                                {datosServicios.map((d, i) => {
                                    const pct = Math.round((d.valor / maxServicio) * 100);
                                    return (
                                        <div key={i} className="space-y-1">
                                            <div className="flex justify-between text-xs">
                                                <span className={`font-bold ${coloresTexto[i]}`}>{d.nombre}</span>
                                                <span className="font-black text-white">{d.valor} <span className="text-[8px] text-slate-500">serv.</span></span>
                                            </div>
                                            <div className="w-full bg-slate-950 h-3 rounded-full overflow-hidden">
                                                <div 
                                                    className="h-full rounded-full stat-bar-animated"
                                                    style={{ 
                                                        width: `${pct}%`, 
                                                        backgroundColor: colores[i],
                                                        boxShadow: `0 0 10px ${colores[i]}50`,
                                                        '--target-width': `${pct}%`
                                                    }}
                                                ></div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = React.useState('formulario');
            const [minutas, setMinutas] = React.useState([]);
            const [notificacion, setNotificacion] = React.useState({ mensaje: '', tipo: 'success', visible: false });
            const [filtroTexto, setFiltroTexto] = React.useState('');
            const [filtroServicio, setFiltroServicio] = React.useState('Todos');
            const [filtroTurno, setFiltroTurno] = React.useState('Todos');
            const [minutaSeleccionada, setMinutaSeleccionada] = React.useState(null);
            const [minutaEliminarConfirm, setMinutaEliminarConfirm] = React.useState(null);
            const [editId, setEditId] = React.useState(null);
            
            const [user, setUser] = React.useState(AUTH.verificarSesion() ? { uid: AUTH.verificarSesion().uid, email: AUTH.verificarSesion().email } : null);
            const [modoFuncionario, setModoFuncionario] = React.useState(!AUTH.verificarSesion());
            
            const [conexionEstado, setConexionEstado] = React.useState('conectado');
            const [comprimiendo, setComprimiendo] = React.useState(false);
            const [cargandoMinutas, setCargandoMinutas] = React.useState(true);
            const [loginError, setLoginError] = React.useState('');
            const [modoOffline, setModoOffline] = React.useState(false);

            const initialFormState = {
                fecha: new Date().toISOString().split('T')[0], turno: 'A', funcionario: '', reporta: '',
                parteDiario: '', servicioRealizado: 'Seleccione un servicio...', servicioPersonalizado: '',
                ubicacion: PARROQUIAS[0], direccion: '', cuadrantePaz: '', horaSalida: '', horaLlegada: '', horaRegreso: '',
                estatus: 'Culminado', hipotesis: '', unidades: [], organismos: [], observaciones: '', imagenes: [], creadoPor: 'anonimo'
            };

            const [form, setForm] = React.useState(initialFormState);
            const [menuUnidades, setMenuUnidades] = React.useState(false);
            const [menuOrganismos, setMenuOrganismos] = React.useState(false);

            const menuOrganismosRef = React.useRef(null);

            const usuarioEsAdmin = user ? esAdmin(user.email) : false;

            if (cargandoMinutas && !user) {
                return <div className="min-h-screen flex items-center justify-center bg-[#0a0f1a]"><div className="text-center"><img src="images/logo.png" className="w-20 h-20 mx-auto animate-pulse" /><h2 className="text-lg font-bold text-white mt-4">Cargando sistema...</h2></div></div>;

                                            <div><label className="text-[10px] uppercase font-bold text-slate-400 block mb-1">Hipótesis</label><input type="text" value={form.hipotesis} onChange={e => setForm({...form, hipotesis: e.target.value})} placeholder="Ej: Falla Eléctrica" className="input-field" /></div>

                        {activeTab === 'lista' && (

                                        {minutaSeleccionada.parteDiario && <div><p className="text-[9px] uppercase text-slate-500 font-bold">Parte Diario</p><p className="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80 italic text-white">"{minutaSeleccionada.parteDiario}"</p></div>}
                                        <div><p className="text-[9px] uppercase text-slate-500 font-bold">Dirección</p><p className="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80 italic text-white">"{minutaSeleccionada.direccion}"</p></div>
                                        <div className="grid grid-cols-3 gap-2 text-center bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                                            <div><span className="block text-[8px] uppercase text-slate-500 font-bold">Salida</span><span className="font-mono text-sm font-bold text-red-400">{minutaSeleccionada.horaSalida || 'N/R'}</span></div>
                                            <div><span className="block text-[8px] uppercase text-slate-500 font-bold">Llegada</span><span className="font-mono text-sm font-bold text-red-400">{minutaSeleccionada.horaLlegada || 'N/R'}</span></div>
                                            <div><span className="block text-[8px] uppercase text-slate-500 font-bold">Retorno</span><span className="font-mono text-sm font-bold text-red-400">{minutaSeleccionada.horaRegreso || 'N/R'}</span></div>
                                        </div>
                                        <div><p className="text-[9px] uppercase text-slate-500 font-bold">Observaciones</p><div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 max-h-40 overflow-y-auto">{minutaSeleccionada.observaciones}</div></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {minutaEliminarConfirm && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className="card max-w-sm w-full text-center space-y-4">
                                    <span className="text-3xl">⚠️</span>
                                    <h3 className="text-sm font-black uppercase text-white">¿Eliminar?</h3>
                                    <div className="flex gap-2 justify-center">
                                        <button onClick={() => setMinutaEliminarConfirm(null)} className="btn-accion btn-secondary">Cancelar</button>
                                        {usuarioEsAdmin ? <button onClick={() => eliminarMinuta(minutaEliminarConfirm)} className="btn-accion bg-red-600 hover:bg-red-700 text-white">Eliminar</button> : <button className="btn-accion bg-slate-700 text-slate-400" disabled>🔒 Sin permisos</button>}
                                    </div>
                                </div>
                            </div>
                        )}

                        <footer className="mt-16 border-t border-slate-900 pt-8 pb-12 flex flex-col items-center gap-3">
                            <div className="inline-flex items-center gap-2.5 px-4 py-2 bg-slate-900/60 border border-slate-800 rounded-full">
                                <span className="relative flex h-2 w-2"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span></span>
                                <span className="text-[10px] uppercase font-black tracking-widest text-slate-400">Bomberos Pedraza <span className="text-white">v3.1</span></span>
                            </div>
                            <p className="text-[8px] text-slate-600">Diseñada por <span className="text-red-400 font-bold">JHON LOPEZ</span></p>
                        </footer>
                    </div>
                </ErrorBoundary>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
